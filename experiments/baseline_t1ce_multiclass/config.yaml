experiment_name: strict_multimodal_clean
seed: 42

data:
  root: ../../BraTS-2024-Complete
  patient_lists_dir: ../../patient_lists
  datasets:
    GLI:
      folder: BraTS-GLI
      label_suffix: -seg.nii.gz
      list_files:
        train: gli_train.txt
        val: gli_val.txt
    PED:
      folder: BraTS-PED
      label_suffix: -seg.nii.gz
      list_files:
        train: ped_train.txt
        val: ped_val.txt
  modalities: [t1c, t2w, t2f]

labels:
  setup: regions
  et_labels: [3, 4]

patch:
  size: [128, 128, 128]
  min_fg_ratio: 0.02
  max_sample_tries: 30
  tumor_margin: 24

dataloader:
  batch_size: 2
  num_workers: 2
  shuffle: true

model:
  name: unet
  channels: [16, 32, 64, 128, 256]
  strides: [2, 2, 2, 2]
  num_res_units: 2
  in_channels: 3
  out_channels: 3

training:
  learning_rate: 0.0002
  epochs: 60
  val_interval: 1
  checkpoint_dir: checkpoints/strict_multimodal_clean
  log_every: 10
  loss:
    lambda_dice: 1.0
    lambda_focal: 1.0
    focal_gamma: 2.0

inference:
  overlap: 0.25
  threshold: 0.5
  min_component_size: 50