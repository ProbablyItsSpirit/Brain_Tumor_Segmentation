experiment_name: baseline_t1ce_multiclass
seed: 42

data:
  root: ../../BraTS-2024-Complete
  patient_lists_dir: ../../patient_lists
  modality: t1c
  label_mapping:
    0: 0
    1: 1
    2: 2
    3: 3
    4: 3
  datasets:
    GLI:
      folder: BraTS-GLI
      image_suffix: -t1c.nii.gz
      label_suffix: -seg.nii.gz
      list_files:
        train: gli_train.txt
        test: gli_val.txt
    PED:
      folder: BraTS-PED
      image_suffix: -t1c.nii.gz
      label_suffix: -seg.nii.gz
      list_files:
        train: ped_train.txt
        test: ped_val.txt
    MEN:
      folder: BraTS-MEN-RT
      image_suffix: _t1c.nii.gz
      label_suffix: _gtv.nii.gz
      list_files:
        train: men_train.txt
        test: men_val.txt

splits:
  train:
    GLI: train
  test:
    PED: train
    MEN: train

patch:
  size: [128, 128, 128]
  num_samples: 1
  pos: 3
  neg: 1

dataloader:
  batch_size: 2
  num_workers: 2
  shuffle: true

training:
  learning_rate: 0.0002
  epochs: 10
  val_interval: 1
  checkpoint_dir: checkpoints/baseline_t1ce_multiclass
  log_every: 20
  loss:
    lambda_ce: 0.5
    lambda_dice: 0.5
    lambda_focal: 0.5
    focal_gamma: 2.0
    class_weights: [0.05, 0.2, 0.25, 0.5]