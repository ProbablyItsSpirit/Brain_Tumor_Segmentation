experiment_name: baseline_flair_only_gli
seed: 42

data:
  root: ../../../BraTS-2024-Complete
  patient_lists_dir: ../../../patient_lists
  modality: t2f
  label_mapping:
    0: 0
    1: 1
    2: 2
    3: 3
    4: 3
  datasets:
    GLI:
      folder: BraTS-GLI
      image_suffix: -t2f.nii.gz
      label_suffix: -seg.nii.gz
      list_files:
        train: gli_train.txt
        test: gli_val.txt

splits:
  train:
    GLI: train

patch:
  size: [128, 128, 128]

# Keep the baseline simple: one image channel, no strict rejection, no MEN/PED.
dataloader:
  batch_size: 1
  num_workers: 2
  shuffle: true

training:
  learning_rate: 0.0002
  epochs: 10
  val_interval: 1
  checkpoint_dir: ../checkpoints/flair_only_gli_baseline
  log_every: 10
  loss:
    lambda_ce: 0.5
    lambda_dice: 0.5
    lambda_focal: 0.5
    focal_gamma: 2.0
    class_weights: [0.05, 0.2, 0.25, 0.5]
